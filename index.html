<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gitee代码获取（luogu）</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 0;
            padding: 2rem 2rem 1.5rem 2rem;
            overflow: hidden;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
        }

        .search-box {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .code-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--code-bg);
            border-radius: var(--radius);
            overflow: hidden;
            min-height: 0;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: #2d2d2d;
            color: #ccc;
            font-size: 0.85rem;
            font-weight: 500;
            flex-shrink: 0;
        }

        .copy-btn {
            background: transparent;
            color: #ccc;
            border: 1px solid #555;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #444;
            color: white;
        }

        pre {
            margin: 0;
            padding: 1rem;
            overflow: auto;
            flex: 1;
            color: var(--code-text);
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        code {
            font-family: inherit;
            white-space: inherit;
        }

        .status-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #d4d4d4;
            gap: 0.75rem;
        }

        .loader {
            width: 32px;
            height: 32px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .not-found-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .not-found-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f87171;
        }
        .not-found-sub {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem 1rem 1rem 1rem;
            }
            .search-box {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Gitee代码获取（luogu）</h1>
        <p class="subtitle">输入洛谷题号，获取对应 C++ 代码（多源自动切换）</p>

        <div class="search-box">
            <input type="text" id="codeInput" placeholder="请输入luogu题号，例如 P1020" />
            <button id="fetchBtn">🔍 查询代码</button>
        </div>

        <div id="codeContainer" class="code-container" style="display: none;">
            <div class="code-header">
                <span id="fileName">code.cpp</span>
                <button class="copy-btn" id="copyBtn" style="display: none;">📋 复制</button>
            </div>
            <pre><code id="codeContent"></code></pre>
        </div>
    </div>

    <script>
        (function() {
            // 配置
            const PRIMARY_API   = 'https://zsyzcodeedgeoneapi.zzjjack.us.kg';   // 主API（已修复CORS）
            const FALLBACK_API  = 'https://getzsyzcodeapi.zzjjack.us.kg';       // 备用API
            const GITEE_RAW_BASE = 'https://raw.giteeusercontent.com/jimmyflower6/zsyz-jimmy/raw/master/code/';
            const REQUEST_TIMEOUT = 15000;

            const codeInput = document.getElementById('codeInput');
            const fetchBtn = document.getElementById('fetchBtn');
            const codeContainer = document.getElementById('codeContainer');
            const codeContent = document.getElementById('codeContent');
            const fileName = document.getElementById('fileName');
            const copyBtn = document.getElementById('copyBtn');

            codeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') fetchCode();
            });
            fetchBtn.addEventListener('click', fetchCode);

            async function fetchWithTimeout(url, timeout = REQUEST_TIMEOUT) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeout);
                try {
                    const response = await fetch(url, { signal: controller.signal });
                    clearTimeout(timer);
                    if (!response.ok) return null;
                    const text = await response.text();
                    if (text.includes('Repository or file not found') ||
                        text.includes('not found') ||
                        text.trim().toLowerCase().startsWith('error')) {
                        return null;
                    }
                    return text;
                } catch (err) {
                    clearTimeout(timer);
                    return null;
                }
            }

            function showLoading() {
                codeContent.innerHTML = `
                    <div class="status-wrapper">
                        <div class="loader"></div>
                        <span>正在获取代码，请稍候…</span>
                    </div>
                `;
                fileName.textContent = '加载中...';
                copyBtn.style.display = 'none';
                codeContainer.style.display = 'flex';
            }

            function showCode(text, filename) {
                codeContent.style.color = '#d4d4d4';
                codeContent.textContent = text;
                fileName.textContent = filename || `${codeInput.value.trim()}.cpp`;
                copyBtn.style.display = 'inline-block';
                codeContainer.style.display = 'flex';
            }

            function showNotFound() {
                codeContent.innerHTML = `
                    <div class="status-wrapper">
                        <div class="not-found-icon">😕</div>
                        <div class="not-found-title">没有找到此题的代码</div>
                        <div class="not-found-sub">请确认题号是否正确，或稍后重试</div>
                    </div>
                `;
                fileName.textContent = '未找到';
                copyBtn.style.display = 'none';
                codeContainer.style.display = 'flex';
            }

            async function fetchCode() {
                const code = codeInput.value.trim();
                if (!code) {
                    showNotFound();
                    return;
                }

                fetchBtn.disabled = true;
                codeInput.disabled = true;
                fetchBtn.textContent = '⏳ 查询中...';
                showLoading();

                let codeText = null;

                // 1. 主 API（现在已支持 CORS，通常最快）
                codeText = await fetchWithTimeout(`${PRIMARY_API}/?code=${encodeURIComponent(code)}`);
                if (codeText) {
                    finishWithCode(codeText, code);
                    return;
                }

                // 2. 备用 API
                codeText = await fetchWithTimeout(`${FALLBACK_API}/?code=${encodeURIComponent(code)}`);
                if (codeText) {
                    finishWithCode(codeText, code);
                    return;
                }

                // 3. Gitee 直链
                const rawUrl = `${GITEE_RAW_BASE}${encodeURIComponent(code)}.cpp`;
                codeText = await fetchWithTimeout(rawUrl);
                if (codeText) {
                    finishWithCode(codeText, code);
                    return;
                }

                showNotFound();
                finishRequest();
            }

            function finishWithCode(text, code) {
                showCode(text, `${code}.cpp`);
                finishRequest();
            }

            function finishRequest() {
                fetchBtn.disabled = false;
                codeInput.disabled = false;
                fetchBtn.textContent = '🔍 查询代码';
                codeInput.focus();
            }

            copyBtn.addEventListener('click', async () => {
                if (copyBtn.style.display === 'none') return;
                const code = codeContent.textContent;
                if (!code || code.trim() === '') return;

                try {
                    await navigator.clipboard.writeText(code);
                    copyBtn.textContent = '✅ 已复制';
                    setTimeout(() => { copyBtn.textContent = '📋 复制'; }, 2000);
                } catch (err) {
                    const textarea = document.createElement('textarea');
                    textarea.value = code;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    copyBtn.textContent = '✅ 已复制';
                    setTimeout(() => { copyBtn.textContent = '📋 复制'; }, 2000);
                }
            });

            codeInput.focus();
        })();
    </script>
</body>
</html>
