<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gitee代码获取（luogu）</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面锁定，无整体滚动 */
        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 0;          /* 全高度时圆角不协调，保留直角 */
            padding: 2rem 2rem 1.5rem 2rem; /* 底部留白，避免代码框贴边 */
            overflow: hidden;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
        }

        .search-box {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 代码容器：自动撑满剩余高度 */
        .code-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--code-bg);
            border-radius: var(--radius);   /* 四个角都有圆角，底部不再贴边 */
            overflow: hidden;
            min-height: 0; /* 允许收缩 */
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: #2d2d2d;
            color: #ccc;
            font-size: 0.85rem;
            font-weight: 500;
            flex-shrink: 0;
        }

        .copy-btn {
            background: transparent;
            color: #ccc;
            border: 1px solid #555;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #444;
            color: white;
        }

        /* 代码框独占滚动 */
        pre {
            margin: 0;
            padding: 1rem;
            overflow: auto;           /* 滚动 */
            flex: 1;
            color: var(--code-text);
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        code {
            font-family: inherit;
            white-space: inherit;
        }

        /* 美化的未找到提示 */
        .not-found-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #f87171;
            gap: 0.5rem;
        }
        .not-found-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .not-found-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .not-found-sub {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .container {
                padding: 1rem 1rem 1rem 1rem;
            }
            .search-box {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Gitee代码获取（luogu）</h1>
        <p class="subtitle">输入洛谷题号，获取对应 C++ 代码</p>

        <div class="search-box">
            <input type="text" id="codeInput" placeholder="请输入luogu题号" />
            <button id="fetchBtn">查询代码</button>
        </div>

        <!-- 代码显示区域（初始隐藏） -->
        <div id="codeContainer" class="code-container" style="display: none;">
            <div class="code-header">
                <span id="fileName">code.cpp</span>
                <button class="copy-btn" id="copyBtn">📋 复制</button>
            </div>
            <pre><code id="codeContent"></code></pre>
        </div>
    </div>

    <script>
        // ================== 配置：主 API 和备用 API ==================
        const PRIMARY_URL   = 'https://zsyzcodeedgeoneapi.zzjjack.us.kg';   // 主 API
        const FALLBACK_URL  = 'https://getzsyzcodeapi.zzjjack.us.kg';       // 备用 API
        // ================================================================

        const codeInput = document.getElementById('codeInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const codeContainer = document.getElementById('codeContainer');
        const codeContent = document.getElementById('codeContent');
        const fileName = document.getElementById('fileName');
        const copyBtn = document.getElementById('copyBtn');

        codeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') fetchCode();
        });
        fetchBtn.addEventListener('click', fetchCode);

        // 向指定 API 请求代码，成功返回代码文本，失败返回 null
        async function fetchFromUrl(url, code) {
            try {
                const response = await fetch(`${url}/?code=${encodeURIComponent(code)}`);
                if (!response.ok) return null;
                const text = await response.text();
                // 根据常见错误特征判断是否未找到
                if (text.includes('Repository or file not found') ||
                    text.includes('not found') ||
                    text.trim().toLowerCase().startsWith('error')) {
                    return null;
                }
                return text;
            } catch (e) {
                return null;
            }
        }

        // 显示代码
        function showCode(text, filename) {
            // 恢复代码样式
            codeContent.style.color = '#d4d4d4';
            codeContent.innerHTML = '';          // 清除可能的 HTML
            codeContent.textContent = text;
            fileName.textContent = filename || `${codeInput.value.trim()}.cpp`;
            copyBtn.style.display = 'inline-block';   // 显示复制按钮
            codeContainer.style.display = 'flex';
        }

        // 显示美化的未找到提示
        function showNotFound() {
            codeContent.style.color = '#d4d4d4';
            codeContent.innerHTML = `
                <div class="not-found-wrapper">
                    <div class="not-found-icon">😕</div>
                    <div class="not-found-title">没有找到此题的代码</div>
                    <div class="not-found-sub">请确认题号是否正确，或尝试其他题号</div>
                </div>
            `;
            fileName.textContent = '未找到';
            copyBtn.style.display = 'none';      // 隐藏复制按钮
            codeContainer.style.display = 'flex';
        }

        // 主流程：优先主 API，失败再试备用 API
        async function fetchCode() {
            const code = codeInput.value.trim();
            if (!code) {
                showNotFound();
                return;
            }

            fetchBtn.disabled = true;
            codeInput.disabled = true;

            try {
                // 先尝试主 API
                let codeText = await fetchFromUrl(PRIMARY_URL, code);

                // 若主 API 未成功，再尝试备用 API
                if (!codeText) {
                    codeText = await fetchFromUrl(FALLBACK_URL, code);
                }

                if (codeText) {
                    showCode(codeText, `${code}.cpp`);
                } else {
                    showNotFound();
                }
            } catch (error) {
                showNotFound();
            } finally {
                fetchBtn.disabled = false;
                codeInput.disabled = false;
            }
        }

        // 复制功能（仅当有有效代码时有效）
        copyBtn.addEventListener('click', async () => {
            // 如果当前是未找到状态（按钮已隐藏），则忽略点击
            if (copyBtn.style.display === 'none') return;

            const code = codeContent.textContent;
            if (!code || code.trim() === '') return;

            try {
                await navigator.clipboard.writeText(code);
                copyBtn.textContent = '✅ 已复制';
                setTimeout(() => { copyBtn.textContent = '📋 复制'; }, 2000);
            } catch (err) {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = code;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                copyBtn.textContent = '✅ 已复制';
                setTimeout(() => { copyBtn.textContent = '📋 复制'; }, 2000);
            }
        });

        codeInput.focus();
    </script>
</body>
</html>
