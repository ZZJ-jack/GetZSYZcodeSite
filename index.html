<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZZJ-JACK洛谷题号查询Gitee代码获取</title>
    <meta name="description" content="输入洛谷题号（如 P1020），即可快速获取对应的 C++ 代码。采用双 API 并行请求，极致响应速度，支持一键复制代码。">
    <meta name="keywords" content="洛谷,luogu,题号,代码查询,Gitee,C++代码,编程,算法">
    <meta name="author" content="zzjjack">

    <!-- 🔗 预连接：提前建立到两个 API 的连接，减少后续请求延迟 -->
    <link rel="preconnect" href="https://zsyzcodeedgeoneapi.zzjjack.us.kg">
    <link rel="preconnect" href="https://getzsyzcodeapi.zzjjack.us.kg">
    <!-- 额外 DNS 预解析，兼容支持 -->
    <link rel="dns-prefetch" href="https://zsyzcodeedgeoneapi.zzjjack.us.kg">
    <link rel="dns-prefetch" href="https://getzsyzcodeapi.zzjjack.us.kg">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 0;
            padding: 2rem 2rem 1.5rem 2rem;
            overflow: hidden;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
        }

        .search-box {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .code-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--code-bg);
            border-radius: var(--radius);
            overflow: hidden;
            min-height: 0;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: #2d2d2d;
            color: #ccc;
            font-size: 0.85rem;
            font-weight: 500;
            flex-shrink: 0;
        }

        .copy-btn {
            background: transparent;
            color: #ccc;
            border: 1px solid #555;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #444;
            color: white;
        }

        pre {
            margin: 0;
            padding: 1rem;
            overflow: auto;
            flex: 1;
            color: var(--code-text);
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        code {
            font-family: inherit;
            white-space: inherit;
        }

        /* 状态提示样式 */
        .status-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #d4d4d4;
            gap: 0.75rem;
        }

        .loader {
            width: 32px;
            height: 32px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .not-found-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .not-found-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f87171;
        }
        .not-found-sub {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem 1rem 1rem 1rem;
            }
            .search-box {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>📄 Gitee代码获取（luogu）</h1>
        <p class="subtitle">输入洛谷题号，获取对应 C++ 代码（双 API 并行，极速响应）</p>

        <section class="search-box">
            <input type="text" id="codeInput" placeholder="请输入luogu题号，例如 P1020" aria-label="洛谷题号输入框" />
            <button id="fetchBtn" aria-label="查询代码">🔍 查询代码</button>
        </section>

        <section id="codeContainer" class="code-container" style="display: none;" aria-live="polite">
            <div class="code-header">
                <span id="fileName">code.cpp</span>
                <button class="copy-btn" id="copyBtn" style="display: none;" aria-label="复制代码">📋 复制</button>
            </div>
            <pre><code id="codeContent"></code></pre>
        </section>
    </main>

    <script>
        (function() {
            // ================== 配置 ==================
            const PRIMARY_API   = 'https://zsyzcodeedgeoneapi.zzjjack.us.kg';   // 主 API（已支持 CORS）
            const FALLBACK_API  = 'https://getzsyzcodeapi.zzjjack.us.kg';       // 备用 API
            const REQUEST_TIMEOUT = 5000;  // 单次请求超时 5 秒，快速失败
            // ========================================

            const codeInput = document.getElementById('codeInput');
            const fetchBtn = document.getElementById('fetchBtn');
            const codeContainer = document.getElementById('codeContainer');
            const codeContent = document.getElementById('codeContent');
            const fileName = document.getElementById('fileName');
            const copyBtn = document.getElementById('copyBtn');

            codeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') fetchCode();
            });
            fetchBtn.addEventListener('click', fetchCode);

            /**
             * 带超时的 fetch，返回成功文本，否则 reject
             */
            function fetchWithTimeout(url, timeout = REQUEST_TIMEOUT) {
                return new Promise((resolve, reject) => {
                    const controller = new AbortController();
                    const timer = setTimeout(() => {
                        controller.abort();
                        reject(new Error('请求超时'));
                    }, timeout);

                    fetch(url, { signal: controller.signal })
                        .then(response => {
                            clearTimeout(timer);
                            if (!response.ok) {
                                return reject(new Error(`状态码 ${response.status}`));
                            }
                            return response.text();
                        })
                        .then(text => {
                            // 过滤异常内容
                            if (text.includes('Repository or file not found') ||
                                text.includes('not found') ||
                                text.trim().toLowerCase().startsWith('error')) {
                                return reject(new Error('内容无效'));
                            }
                            resolve(text);
                        })
                        .catch(err => {
                            clearTimeout(timer);
                            reject(err);
                        });
                });
            }

            function showLoading() {
                codeContent.innerHTML = `
                    <div class="status-wrapper">
                        <div class="loader"></div>
                        <span>正在获取代码，请稍候…</span>
                    </div>
                `;
                fileName.textContent = '加载中...';
                copyBtn.style.display = 'none';
                codeContainer.style.display = 'flex';
            }

            function showCode(text, filename) {
                codeContent.style.color = '#d4d4d4';
                codeContent.textContent = text;
                fileName.textContent = filename || `${codeInput.value.trim()}.cpp`;
                copyBtn.style.display = 'inline-block';
                codeContainer.style.display = 'flex';
            }

            function showNotFound() {
                codeContent.innerHTML = `
                    <div class="status-wrapper">
                        <div class="not-found-icon">😕</div>
                        <div class="not-found-title">没有找到此题的代码</div>
                        <div class="not-found-sub">请确认题号是否正确，或稍后重试</div>
                    </div>
                `;
                fileName.textContent = '未找到';
                copyBtn.style.display = 'none';
                codeContainer.style.display = 'flex';
            }

            async function fetchCode() {
                const code = codeInput.value.trim();
                if (!code) {
                    showNotFound();
                    return;
                }

                // 界面锁定
                fetchBtn.disabled = true;
                codeInput.disabled = true;
                fetchBtn.textContent = '⏳ 查询中...';
                showLoading();

                // 构建两个 API 的请求 URL
                const primaryUrl = `${PRIMARY_API}/?code=${encodeURIComponent(code)}`;
                const fallbackUrl = `${FALLBACK_API}/?code=${encodeURIComponent(code)}`;

                try {
                    // 🚀 并行请求：任意一个成功即返回，两个都失败则抛错
                    const firstSuccess = await Promise.any([
                        fetchWithTimeout(primaryUrl),
                        fetchWithTimeout(fallbackUrl)
                    ]);

                    // 成功获取
                    showCode(firstSuccess, `${code}.cpp`);
                } catch (e) {
                    // 所有请求均失败（超时或返回无效内容）
                    showNotFound();
                } finally {
                    // 恢复界面
                    fetchBtn.disabled = false;
                    codeInput.disabled = false;
                    fetchBtn.textContent = '🔍 查询代码';
                    codeInput.focus();
                }
            }

            // 复制功能
            copyBtn.addEventListener('click', async () => {
                if (copyBtn.style.display === 'none') return;
                const code = codeContent.textContent;
                if (!code || code.trim() === '') return;

                try {
                    await navigator.clipboard.writeText(code);
                    copyBtn.textContent = '✅ 已复制';
                    setTimeout(() => { copyBtn.textContent = '📋 复制'; }, 2000);
                } catch (err) {
                    // 降级方案
                    const textarea = document.createElement('textarea');
                    textarea.value = code;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    copyBtn.textContent = '✅ 已复制';
                    setTimeout(() => { copyBtn.textContent = '📋 复制'; }, 2000);
                }
            });

            codeInput.focus();
        })();
    </script>
</body>
</html>
